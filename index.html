<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta description="Эту Windows 10 сделал именно v0 by Vercel" />
<title>Windows 10 — Веб-симуляция</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --accent: #0078d7;
    --taskbar: rgba(20, 20, 20, 0.85);
    --win-bg: #f3f3f3;
    --win-head: #ffffff;
    --font: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  }
  html, body {
    height: 100%;
    width: 100%;
    overflow: hidden;
    font-family: var(--font);
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    background: #000;
  }

  /* ===== BOOT SCREEN ===== */
  #boot {
    position: fixed; inset: 0;
    background: #000;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 1000;
    transition: opacity .6s ease;
  }
  .win-logo {
    display: grid;
    grid-template-columns: 42px 42px;
    grid-template-rows: 42px 42px;
    gap: 6px;
    margin-bottom: 60px;
  }
  .win-logo span { background: #fff; opacity: .95; }
  .spinner {
    width: 42px; height: 42px;
    position: relative;
  }
  .spinner div {
    position: absolute;
    width: 6px; height: 6px;
    background: #fff; border-radius: 50%;
    animation: orbit 1.6s linear infinite;
  }
  @keyframes orbit {
    0%   { transform: rotate(0deg) translateX(20px); opacity: 0; }
    30%  { opacity: 1; }
    100% { transform: rotate(360deg) translateX(20px); opacity: 0; }
  }

  /* ===== LOCK SCREEN ===== */
  #lock {
    position: fixed; inset: 0;
    background-size: cover; background-position: center;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 900;
    color: #fff;
    transition: opacity .5s ease, transform .5s ease;
    cursor: pointer;
  }
  #lock::before {
    content: ""; position: absolute; inset: 0;
    background: rgba(0,0,0,.25);
  }
  .lock-clock {
    position: absolute; bottom: 90px; left: 60px;
    text-shadow: 0 2px 8px rgba(0,0,0,.5);
  }
  .lock-time { font-size: 92px; font-weight: 300; line-height: 1; }
  .lock-date { font-size: 28px; font-weight: 400; margin-top: 6px; }
  .lock-hint {
    position: absolute; bottom: 40px;
    width: 100%; text-align: center; font-size: 15px;
    text-shadow: 0 2px 6px rgba(0,0,0,.6);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:.6} 50%{opacity:1} }

  /* ===== LOGIN ===== */
  #login {
    position: fixed; inset: 0;
    background-size: cover; background-position: center;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 850; color: #fff;
  }
  #login::before {
    content: ""; position: absolute; inset: 0;
    background: rgba(0,60,120,.55); backdrop-filter: blur(6px);
  }
  .login-box { position: relative; text-align: center; }
  .avatar {
    width: 140px; height: 140px; border-radius: 50%;
    background: #fff; margin: 0 auto 18px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .avatar svg { width: 90px; height: 90px; fill: var(--accent); }
  .login-name { font-size: 28px; font-weight: 400; margin-bottom: 22px; }
  .login-row { display: flex; gap: 8px; justify-content: center; }
  .login-input {
    width: 250px; padding: 9px 14px; border: none; border-radius: 3px;
    background: rgba(255,255,255,.85); font-size: 15px; outline: none;
  }
  .login-btn {
    width: 40px; border: none; border-radius: 3px; background: rgba(255,255,255,.85);
    cursor: pointer; font-size: 18px; color: #333;
  }
  .login-btn:hover { background: #fff; }

  /* ===== DESKTOP ===== */
  #desktop {
    position: fixed; inset: 0;
    background-size: cover; background-position: center;
    display: none;
  }
  #icons {
    position: absolute; top: 12px; left: 12px;
    display: flex; flex-direction: column; flex-wrap: wrap;
    gap: 4px; max-height: calc(100vh - 60px);
  }
  .dicon {
    width: 84px; padding: 8px 4px; border-radius: 3px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    cursor: pointer; color: #fff; text-align: center;
    text-shadow: 0 1px 3px rgba(0,0,0,.9);
  }
  .dicon:hover { background: rgba(255,255,255,.15); }
  .dicon.selected { background: rgba(0,120,215,.4); outline: 1px solid rgba(255,255,255,.4); }
  .dicon .ic { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
  .dicon .ic svg { width: 38px; height: 38px; }
  .dicon span { font-size: 12px; word-break: break-word; }

  /* ===== WINDOWS ===== */
  .window {
    position: absolute;
    background: var(--win-bg);
    border: 1px solid #bbb;
    box-shadow: 0 12px 40px rgba(0,0,0,.35);
    display: flex; flex-direction: column;
    min-width: 260px; min-height: 160px;
    overflow: hidden;
  }
  .window.active { border-color: var(--accent); }
  .titlebar {
    height: 32px; background: var(--win-head);
    display: flex; align-items: center;
    padding-left: 10px; cursor: move; flex-shrink: 0;
    border-bottom: 1px solid #eee;
  }
  .titlebar .tb-icon { width: 16px; height: 16px; margin-right: 8px; }
  .titlebar .tb-title { font-size: 12px; color: #333; flex: 1; }
  .tb-controls { display: flex; height: 100%; }
  .tb-btn {
    width: 46px; height: 100%; border: none; background: transparent;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    font-family: "Segoe UI Symbol", var(--font); font-size: 11px; color: #333;
  }
  .tb-btn:hover { background: #e5e5e5; }
  .tb-btn.close:hover { background: #e81123; color: #fff; }
  .win-body { flex: 1; overflow: auto; background: #fff; position: relative; }
  .resizer {
    position: absolute; width: 14px; height: 14px; right: 0; bottom: 0;
    cursor: nwse-resize; z-index: 5;
  }

  /* ===== TASKBAR ===== */
  #taskbar {
    position: fixed; bottom: 0; left: 0; right: 0; height: 44px;
    background: var(--taskbar); backdrop-filter: blur(12px);
    display: none; align-items: center; z-index: 800;
    color: #fff;
  }
  .start-btn {
    width: 48px; height: 100%; display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .start-btn:hover { background: rgba(255,255,255,.12); }
  .start-btn svg { width: 22px; height: 22px; }
  .search {
    height: 30px; margin: 0 6px; background: #fff; border-radius: 2px;
    display: flex; align-items: center; padding: 0 10px; gap: 8px;
    width: 260px; color: #555;
  }
  .search input { border: none; outline: none; font-size: 13px; flex: 1; background: transparent; }
  .search svg { width: 15px; height: 15px; fill: #555; }
  .task-apps { display: flex; align-items: center; gap: 2px; flex: 1; height: 100%; }
  .task-item {
    height: 100%; width: 44px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; position: relative; border-bottom: 2px solid transparent;
  }
  .task-item:hover { background: rgba(255,255,255,.12); }
  .task-item.open { background: rgba(255,255,255,.12); border-bottom-color: var(--accent); }
  .task-item.open.focused { background: rgba(255,255,255,.22); }
  .task-item svg { width: 22px; height: 22px; }
  .tray {
    display: flex; align-items: center; gap: 12px; padding: 0 12px; height: 100%;
    font-size: 12px;
  }
  .tray svg { width: 16px; height: 16px; fill: #fff; cursor: pointer; }
  .clock { text-align: right; line-height: 1.3; cursor: pointer; padding: 0 6px; }
  .clock:hover { background: rgba(255,255,255,.12); }
  .clock .t { font-size: 12px; }
  .clock .d { font-size: 12px; }
  .show-desktop { width: 6px; height: 100%; border-left: 1px solid rgba(255,255,255,.3); cursor: pointer; }
  .show-desktop:hover { background: rgba(255,255,255,.1); }

  /* ===== START MENU ===== */
  #startmenu {
    position: fixed; bottom: 44px; left: 0; width: 320px;
    background: rgba(30,30,30,.96); backdrop-filter: blur(18px);
    color: #fff; z-index: 810; display: none;
    flex-direction: column; box-shadow: 0 -2px 20px rgba(0,0,0,.5);
    animation: slideUp .18s ease;
  }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0 } to { transform: none; opacity: 1 } }
  .sm-apps { flex: 1; overflow-y: auto; max-height: 420px; padding: 8px 0; }
  .sm-title { padding: 10px 16px 6px; font-size: 12px; color: #aaa; }
  .sm-item {
    display: flex; align-items: center; gap: 12px; padding: 8px 16px;
    cursor: pointer; font-size: 13px;
  }
  .sm-item:hover { background: rgba(255,255,255,.12); }
  .sm-item .ic { width: 22px; height: 22px; display:flex; align-items:center; justify-content:center; }
  .sm-item .ic svg { width: 20px; height: 20px; }
  .sm-tiles { display: grid; grid-template-columns: repeat(3,1fr); gap: 6px; padding: 8px 16px 16px; }
  .tile {
    aspect-ratio: 1; background: var(--accent); border-radius: 2px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px; cursor: pointer; font-size: 11px;
  }
  .tile:hover { outline: 2px solid rgba(255,255,255,.5); }
  .tile svg { width: 26px; height: 26px; }
  .sm-power {
    display: flex; justify-content: flex-start; padding: 6px 8px;
    border-top: 1px solid rgba(255,255,255,.1);
  }
  .sm-power .sm-item { padding: 8px 12px; }

  /* App-specific */
  .np-textarea {
    width: 100%; height: 100%; border: none; outline: none; resize: none;
    padding: 8px; font-family: Consolas, monospace; font-size: 14px; line-height: 1.5;
  }
  .calc { display: flex; flex-direction: column; height: 100%; background: #f9f9f9; }
  .calc-display {
    padding: 18px 16px; text-align: right; font-size: 34px; font-weight: 300;
    min-height: 70px; word-break: break-all; color: #111;
  }
  .calc-grid { flex: 1; display: grid; grid-template-columns: repeat(4,1fr); gap: 1px; background: #ddd; }
  .calc-btn {
    border: none; background: #fafafa; font-size: 18px; cursor: pointer; color: #222;
  }
  .calc-btn:hover { background: #eaeaea; }
  .calc-btn.op { background: #f0f0f0; }
  .calc-btn.eq { background: var(--accent); color: #fff; }
  .calc-btn.eq:hover { background: #0063b1; }

  .browser { display: flex; flex-direction: column; height: 100%; }
  .browser-bar { display: flex; align-items: center; gap: 6px; padding: 6px 8px; background: #f1f1f1; border-bottom: 1px solid #ddd; }
  .browser-bar button { border: none; background: transparent; cursor: pointer; font-size: 15px; width: 28px; height: 28px; border-radius: 4px; }
  .browser-bar button:hover { background: #e0e0e0; }
  .browser-bar input { flex: 1; padding: 6px 12px; border: 1px solid #ccc; border-radius: 16px; outline: none; font-size: 13px; }
  .browser-view { flex: 1; }
  .browser-view iframe { width: 100%; height: 100%; border: none; }
  .browser-home { padding: 40px; text-align: center; }
  .browser-home h1 { font-weight: 300; color: #444; margin-bottom: 20px; }
  .browser-home .links { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .browser-home .links a { padding: 10px 18px; background: var(--accent); color: #fff; text-decoration: none; border-radius: 4px; font-size: 13px; }

  .explorer { display: flex; height: 100%; font-size: 13px; }
  .exp-side { width: 180px; background: #f5f5f5; border-right: 1px solid #ddd; padding: 8px 0; overflow-y: auto; }
  .exp-side .exp-nav { padding: 6px 16px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
  .exp-side .exp-nav:hover { background: #e5e5e5; }
  .exp-side .exp-nav.active { background: #cce4f7; }
  .exp-main { flex: 1; padding: 12px; overflow-y: auto; }
  .exp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px,1fr)); gap: 10px; }
  .exp-file { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px; border-radius: 4px; cursor: pointer; text-align: center; }
  .exp-file:hover { background: #eef4fb; }
  .exp-file svg { width: 40px; height: 40px; }
  .exp-file span { font-size: 12px; word-break: break-word; }

  .settings { display: flex; height: 100%; font-size: 13px; }
  .set-side { width: 190px; background: #f5f5f5; border-right: 1px solid #ddd; padding: 10px 0; }
  .set-nav { padding: 9px 18px; cursor: pointer; display: flex; gap: 10px; }
  .set-nav:hover { background: #e5e5e5; }
  .set-nav.active { background: #cce4f7; border-left: 3px solid var(--accent); }
  .set-main { flex: 1; padding: 24px; overflow-y: auto; }
  .set-main h2 { font-weight: 400; margin-bottom: 16px; }
  .wall-opts { display: flex; gap: 10px; flex-wrap: wrap; }
  .wall-opt { width: 120px; height: 70px; border-radius: 4px; cursor: pointer; background-size: cover; border: 3px solid transparent; }
  .wall-opt.active { border-color: var(--accent); }
  .accent-opts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .accent-opt { width: 34px; height: 34px; border-radius: 4px; cursor: pointer; border: 2px solid transparent; }
  .accent-opt.active { border-color: #333; }

  .context {
    position: fixed; background: #fff; border: 1px solid #ccc; box-shadow: 0 6px 20px rgba(0,0,0,.2);
    z-index: 950; min-width: 180px; display: none; padding: 4px 0; border-radius: 3px;
  }
  .context div { padding: 7px 16px; font-size: 13px; cursor: pointer; }
  .context div:hover { background: var(--accent); color: #fff; }
  .context hr { border: none; border-top: 1px solid #eee; margin: 4px 0; }

  .about { padding: 24px; font-size: 14px; line-height: 1.7; color: #333; }
  .about h2 { font-weight: 300; margin-bottom: 12px; }
  .about b { color: var(--accent); }
</style>
</head>
<body>

<!-- BOOT -->
<div id="boot">
  <div class="win-logo"><span></span><span></span><span></span><span></span></div>
  <div class="spinner">
    <div style="animation-delay:0s"></div><div style="animation-delay:.15s"></div>
    <div style="animation-delay:.3s"></div><div style="animation-delay:.45s"></div>
    <div style="animation-delay:.6s"></div>
  </div>
</div>

<!-- LOCK -->
<div id="lock">
  <div class="lock-clock">
    <div class="lock-time" id="lockTime">00:00</div>
    <div class="lock-date" id="lockDate">—</div>
  </div>
  <div class="lock-hint">Нажмите в любом месте, чтобы разблокировать</div>
</div>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <div class="avatar">
      <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-5 0-9 2.5-9 6v2h18v-2c0-3.5-4-6-9-6z"/></svg>
    </div>
    <div class="login-name">Пользователь</div>
    <div class="login-row">
      <input class="login-input" type="password" id="pwd" placeholder="Пароль (любой)" />
      <button class="login-btn" id="loginGo">→</button>
    </div>
  </div>
</div>

<!-- DESKTOP -->
<div id="desktop">
  <div id="icons"></div>
</div>

<!-- TASKBAR -->
<div id="taskbar">
  <div class="start-btn" id="startBtn" title="Пуск">
    <svg viewBox="0 0 24 24"><path fill="#fff" d="M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z"/></svg>
  </div>
  <div class="search">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 10-.7.7l.27.28v.79l5 5 1.5-1.5-5-5zm-6 0A4.5 4.5 0 1114 9.5 4.5 4.5 0 019.5 14z"/></svg>
    <input placeholder="Введите здесь текст для поиска" />
  </div>
  <div class="task-apps" id="taskApps"></div>
  <div class="tray">
    <svg viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3a4.24 4.24 0 00-6 0zm-4-4l2 2a7.07 7.07 0 0110 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
    <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0014 7.97v8.05a4.5 4.5 0 002.5-4.02z"/></svg>
    <div class="clock" id="clock">
      <div class="t" id="clockT">00:00</div>
      <div class="d" id="clockD">01.01.2026</div>
    </div>
    <div class="show-desktop" id="showDesktop" title="Свернуть все окна"></div>
  </div>
</div>

<!-- START MENU -->
<div id="startmenu">
  <div class="sm-apps" id="smApps"></div>
  <div class="sm-power">
    <div class="sm-item" id="powerBtn">
      <span class="ic"><svg viewBox="0 0 24 24" fill="#fff"><path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42A7 7 0 1112 5V3a9 9 0 105.83 2.17z"/></svg></span>
      Завершение работы
    </div>
  </div>
</div>

<!-- CONTEXT MENU -->
<div class="context" id="ctx">
  <div id="ctxRefresh">Обновить</div>
  <div id="ctxWall">Персонализация</div>
  <hr/>
  <div id="ctxAbout">О системе</div>
</div>

<script>
/* ================= ICONS (SVG strings) ================= */
const ICON = {
  notepad: '<svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="1" fill="#fff" stroke="#999"/><line x1="7" y1="7" x2="17" y2="7" stroke="#0078d7"/><line x1="7" y1="11" x2="17" y2="11" stroke="#ccc"/><line x1="7" y1="15" x2="14" y2="15" stroke="#ccc"/></svg>',
  calc: '<svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2" fill="#0078d7"/><rect x="6.5" y="4.5" width="11" height="4" fill="#fff"/><circle cx="8" cy="12" r="1.2" fill="#fff"/><circle cx="12" cy="12" r="1.2" fill="#fff"/><circle cx="16" cy="12" r="1.2" fill="#fff"/><circle cx="8" cy="16" r="1.2" fill="#fff"/><circle cx="12" cy="16" r="1.2" fill="#fff"/><circle cx="16" cy="16" r="1.2" fill="#fff"/></svg>',
  browser: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#0078d7"/><ellipse cx="12" cy="12" rx="4" ry="10" fill="none" stroke="#fff" stroke-width="1"/><line x1="2" y1="12" x2="22" y2="12" stroke="#fff"/><circle cx="12" cy="12" r="3" fill="#fff"/></svg>',
  explorer: '<svg viewBox="0 0 24 24"><path d="M3 6a2 2 0 012-2h5l2 2h7a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z" fill="#ffca28" stroke="#f5b400"/><path d="M3 9h18v8a2 2 0 01-2 2H5a2 2 0 01-2-2z" fill="#ffd95c"/></svg>',
  settings: '<svg viewBox="0 0 24 24"><path fill="#555" d="M19.4 13a7.6 7.6 0 000-2l2-1.6-2-3.4-2.4 1a7.3 7.3 0 00-1.7-1L15 3H9l-.3 2.6a7.3 7.3 0 00-1.7 1l-2.4-1-2 3.4L4.6 11a7.6 7.6 0 000 2l-2 1.6 2 3.4 2.4-1c.5.4 1.1.7 1.7 1L9 21h6l.3-2.6c.6-.3 1.2-.6 1.7-1l2.4 1 2-3.4zM12 15.5A3.5 3.5 0 1112 8.5a3.5 3.5 0 010 7z"/></svg>',
  recycle: '<svg viewBox="0 0 24 24"><path d="M6 7h12l-1 13a1 1 0 01-1 1H8a1 1 0 01-1-1z" fill="#8bc34a" stroke="#689f38"/><path d="M4 7h16M9 7V5h6v2" stroke="#689f38" fill="none"/></svg>',
  about: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#0078d7"/><rect x="11" y="10" width="2" height="7" fill="#fff"/><circle cx="12" cy="7" r="1.3" fill="#fff"/></svg>',
  file: '<svg viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6z" fill="#fff" stroke="#bbb"/><path d="M15 2v5h5" fill="#eee" stroke="#bbb"/></svg>',
  folder: '<svg viewBox="0 0 24 24"><path d="M3 6a2 2 0 012-2h5l2 2h7a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2z" fill="#ffca28"/></svg>',
  img: '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="1" fill="#4caf50"/><circle cx="8" cy="9" r="1.5" fill="#fff"/><path d="M4 18l5-6 4 4 3-3 4 5z" fill="#fff"/></svg>',
};

/* ================= WALLPAPERS (SVG data URIs) ================= */
function wallSVG(stops){
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='900'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'>${stops.map((s,i)=>`<stop offset='${i/(stops.length-1)}' stop-color='${s}'/>`).join('')}</linearGradient></defs><rect width='1600' height='900' fill='url(#g)'/><path d='M0 650 Q400 550 800 650 T1600 650 V900 H0 Z' fill='rgba(255,255,255,0.06)'/><path d='M0 720 Q400 640 800 720 T1600 720 V900 H0 Z' fill='rgba(0,0,0,0.08)'/></svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}

/* ================= CLOCK ================= */
const DAYS = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
function pad(n){ return n < 10 ? '0'+n : ''+n; }
function updateClock(){
  const d = new Date();
  const t = pad(d.getHours())+':'+pad(d.getMinutes());
  const dateStr = pad(d.getDate())+'.'+pad(d.getMonth()+1)+'.'+d.getFullYear();
  $('#clockT').textContent = t;
  $('#clockD').textContent = dateStr;
  $('#lockTime').textContent = t;
  $('#lockDate').textContent = DAYS[d.getDay()].charAt(0).toUpperCase()+DAYS[d.getDay()].slice(1)+', '+d.getDate()+' '+MONTHS[d.getMonth()];
}
updateClock();
setInterval(updateClock, 1000);

/* ================= WINDOW MANAGEMENT ================= */
function openApp(app){
  // if already open, focus it
  for(const id in windows){
    if(windows[id].app === app){ focusWindow(id); windows[id].el.style.display='flex'; return; }
  }
  const cfg = APPS[app];
  const id = 'win'+(winId++);
  const el = document.createElement('div');
  el.className = 'window';
  el.style.width = cfg.w+'px';
  el.style.height = cfg.h+'px';
  el.style.left = (60 + (winId%6)*30)+'px';
  el.style.top = (40 + (winId%6)*30)+'px';
  el.innerHTML = `
    <div class="titlebar">
      <div class="tb-icon">${cfg.icon}</div>
      <div class="tb-title">${cfg.title}</div>
      <div class="tb-controls">
        <button class="tb-btn min" title="Свернуть">&#8211;</button>
        <button class="tb-btn max" title="Развернуть">&#9633;</button>
        <button class="tb-btn close" title="Закрыть">&#10005;</button>
      </div>
    </div>
    <div class="win-body"></div>
    <div class="resizer"></div>`;
  $('#desktop').appendChild(el);
  windows[id] = { el, app, title: cfg.title, maximized: false, prev: null };

  cfg.render(el.querySelector('.win-body'), id);

  // controls
  el.querySelector('.close').addEventListener('click', () => closeWindow(id));
  el.querySelector('.min').addEventListener('click', () => { el.style.display='none'; updateTaskbar(); });
  el.querySelector('.max').addEventListener('click', () => toggleMax(id));
  el.querySelector('.titlebar').addEventListener('dblclick', () => toggleMax(id));
  el.addEventListener('mousedown', () => focusWindow(id));

  makeDraggable(el, el.querySelector('.titlebar'), id);
  makeResizable(el, el.querySelector('.resizer'));

  focusWindow(id);
  addTaskItem(id);
  updateTaskbar();
}
function closeWindow(id){
  windows[id].el.remove();
  delete windows[id];
  const ti = document.getElementById('task-'+id);
  if(ti) ti.remove();
}
function focusWindow(id){
  zIndex++;
  windows[id].el.style.zIndex = zIndex;
  document.querySelectorAll('.window').forEach(w => w.classList.remove('active'));
  windows[id].el.classList.add('active');
  document.querySelectorAll('.task-item').forEach(t => t.classList.remove('focused'));
  const ti = document.getElementById('task-'+id);
  if(ti) ti.classList.add('focused');
}
function toggleMax(id){
  const w = windows[id];
  if(!w.maximized){
    w.prev = { left: w.el.style.left, top: w.el.style.top, width: w.el.style.width, height: w.el.style.height };
    w.el.style.left='0'; w.el.style.top='0';
    w.el.style.width='100%'; w.el.style.height='calc(100vh - 44px)';
    w.maximized = true;
  } else {
    Object.assign(w.el.style, w.prev);
    w.maximized = false;
  }
}
function makeDraggable(el, handle, id){
  let sx, sy, ox, oy, drag=false;
  handle.addEventListener('mousedown', e => {
    if(e.target.classList.contains('tb-btn')) return;
    if(windows[id].maximized) toggleMax(id);
    drag=true; sx=e.clientX; sy=e.clientY;
    ox=el.offsetLeft; oy=el.offsetTop;
    document.body.style.userSelect='none';
  });
  window.addEventListener('mousemove', e => {
    if(!drag) return;
    let nx = ox + e.clientX - sx, ny = oy + e.clientY - sy;
    ny = Math.max(0, ny);
    el.style.left = nx+'px'; el.style.top = ny+'px';
  });
  window.addEventListener('mouseup', () => { drag=false; document.body.style.userSelect=''; });
}
function makeResizable(el, handle){
  let sx, sy, ow, oh, rz=false;
  handle.addEventListener('mousedown', e => {
    e.stopPropagation(); rz=true; sx=e.clientX; sy=e.clientY;
    ow=el.offsetWidth; oh=el.offsetHeight;
  });
  window.addEventListener('mousemove', e => {
    if(!rz) return;
    el.style.width = Math.max(260, ow + e.clientX - sx)+'px';
    el.style.height = Math.max(160, oh + e.clientY - sy)+'px';
  });
  window.addEventListener('mouseup', () => rz=false);
}

/* ================= TASKBAR ITEMS ================= */
const taskApps = $('#taskApps');
function addTaskItem(id){
  const w = windows[id];
  const el = document.createElement('div');
  el.className = 'task-item open focused';
  el.id = 'task-'+id;
  el.innerHTML = APPS[w.app].icon;
  el.title = w.title;
  el.addEventListener('click', () => {
    const win = windows[id].el;
    if(win.style.display === 'none'){ win.style.display='flex'; focusWindow(id); }
    else if(win.classList.contains('active')){ win.style.display='none'; }
    else focusWindow(id);
    updateTaskbar();
  });
  taskApps.appendChild(el);
}
function updateTaskbar(){
  for(const id in windows){
    const ti = document.getElementById('task-'+id);
    if(ti){
      const hidden = windows[id].el.style.display === 'none';
      ti.classList.toggle('focused', !hidden && windows[id].el.classList.contains('active'));
    }
  }
}

/* ================= START MENU + POWER ================= */
let startOpen = false;
function toggleStart(force){
  startOpen = force !== undefined ? force : !startOpen;
  $('#startmenu').style.display = startOpen ? 'flex' : 'none';
}
$('#startBtn').addEventListener('click', e => { e.stopPropagation(); toggleStart(); });
document.addEventListener('click', e => {
  if(startOpen && !$('#startmenu').contains(e.target) && e.target.closest('#startBtn')==null)
    toggleStart(false);
});
$('#powerBtn').addEventListener('click', () => {
  if(!confirm('Завершить работу и перезагрузить симуляцию?')) return;

});
$('#showDesktop').addEventListener('click', () => {
  const anyVisible = Object.values(windows).some(w => w.el.style.display !== 'none');
  Object.values(windows).forEach(w => w.el.style.display = anyVisible ? 'none' : 'flex');
  updateTaskbar();
});

function renderNotepad(body){

}

function renderCalc(body){
  body.innerHTML = `
    <div class="calc">
      <div class="calc-display" id="cd">0</div>
      <div class="calc-grid">
        ${['C','±','%','÷','7','8','9','×','4','5','6','−','1','2','3','+','±0','0','.','='].map(k=>{
          if(k==='±0') return '';
          const op = ['÷','×','−','+','='].includes(k);
          const eq = k==='=';
          return `<button class="calc-btn ${eq?'eq':op?'op':''}" data-k="${k}">${k}</button>`;
        }).join('')}
      </div>
    </div>`;
  const disp = body.querySelector('#cd');
  let cur='0', prev=null, op=null, reset=false;
  const OPS = {'÷':'/','×':'*','−':'-','+':'+'};
  body.querySelectorAll('.calc-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      const k=b.dataset.k;
      if(k==='C'){ cur='0'; prev=null; op=null; }
      else if(k==='±'){ cur = cur.startsWith('-')?cur.slice(1):'-'+cur; }
      else if(k==='%'){ cur = String(parseFloat(cur)/100); }
      else if(k==='.'){ if(!cur.includes('.')) cur+='.'; }
      else if(OPS[k]){ if(op&&!reset){ compute(); } prev=parseFloat(cur); op=OPS[k]; reset=true; }
      else if(k==='='){ compute(); op=null; }
      else { if(cur==='0'||reset){ cur=k; reset=false; } else cur+=k; }
      disp.textContent = cur;
    });
  });
  function compute(){
    if(op==null||prev==null) return;
    const b=parseFloat(cur); let r=0;
    if(op==='/') r = b===0?'Ошибка':prev/b;
    if(op==='*') r=prev*b; if(op==='-') r=prev-b; if(op==='+') r=prev+b;
    cur = String(Math.round(r*1e10)/1e10); reset=true;
  }
}

function renderBrowser(body){
  body.innerHTML = `
    <div class="browser">
      <div class="browser-bar">
        <button title="Назад">&#8592;</button>
        <button title="Вперёд">&#8594;</button>
        <button class="reload" title="Обновить">&#8635;</button>
        <input class="url" value="https://start.local" />
        <button class="go">Go</button>
      </div>
      <div class="browser-view"></div>
    </div>`;
  const view = body.querySelector('.browser-view');
  const url = body.querySelector('.url');
  function home(){
    view.innerHTML = `<div class="browser-home">
      <h1>Новая вкладка</h1>
      <div class="links">
        <a data-u="https://ru.wikipedia.org" href="#">Википедия</a>
        <a data-u="https://www.bing.com" href="#">Bing</a>
        <a data-u="https://example.com" href="#">Example.com</a>
      </div>
      <p style="margin-top:24px;color:#888;font-size:12px">Введите адрес и нажмите Go. Некоторые сайты запрещают встраивание.</p>
    </div>`;
    view.querySelectorAll('a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();nav(a.dataset.u);}));
  }
  function nav(u){
    if(!/^https?:\/\//.test(u)) u='https://'+u;
    url.value=u;
    view.innerHTML = `<iframe src="${u}" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>`;
    view.querySelector('iframe').addEventListener('error',home);
  }
  body.querySelector('.go').addEventListener('click',()=>nav(url.value));
  url.addEventListener('keydown',e=>{if(e.key==='Enter')nav(url.value);});
  body.querySelector('.reload').addEventListener('click',home);
  home();
}

function renderExplorer(body){
  const FS = {
    'Быстрый доступ': [['Рабочий стол','folder'],['Загрузки','folder'],['Документы','folder'],['Изображения','folder']],
    'Документы': [['Резюме.docx','file'],['Бюджет.xlsx','file'],['Заметки.txt','file'],['Проект','folder']],
    'Изображения': [['Отпуск.png','img'],['Скриншот.png','img'],['Обои.jpg','img']],
    'Загрузки': [['setup.exe','file'],['archive.zip','file'],['video.mp4','file']],
    'Этот компьютер': [['Локальный диск (C:)','folder'],['Данные (D:)','folder']],
  };
  body.innerHTML = `<div class="explorer">
    <div class="exp-side"></div>
    <div class="exp-main"></div>
  </div>`;
  const side = body.querySelector('.exp-side');
  const main = body.querySelector('.exp-main');
  Object.keys(FS).forEach((k,i)=>{
    const n = document.createElement('div');
    n.className='exp-nav'+(i===0?' active':'');
    n.innerHTML = `<span>${ICON.folder}</span><span>${k}</span>`;
    n.querySelector('span').style.width='16px';
    n.addEventListener('click',()=>{
      side.querySelectorAll('.exp-nav').forEach(x=>x.classList.remove('active'));
      n.classList.add('active'); show(k);
    });
    side.appendChild(n);
  });
  function show(k){
    main.innerHTML = `<div class="exp-grid">${FS[k].map(([name,type])=>
      `<div class="exp-file">${ICON[type]}<span>${name}</span></div>`).join('')}</div>`;
    main.querySelectorAll('.exp-file').forEach(f=>{
      f.addEventListener('dblclick',()=>{
        const nm=f.querySelector('span').textContent;
        if(nm.endsWith('.txt')) openApp('notepad');
        else alert('Открытие: '+nm);
      });
    });
  }
  show('Быстрый доступ');
}

function renderSettings(body){
  const SECTIONS = ['Персонализация','Система','Об устройстве'];
  body.innerHTML = `<div class="settings">
    <div class="set-side"></div>
    <div class="set-main"></div>
  </div>`;
  const side = body.querySelector('.set-side');
  const main = body.querySelector('.set-main');
  SECTIONS.forEach((s,i)=>{
    const n=document.createElement('div');
    n.className='set-nav'+(i===0?' active':'');
    n.textContent=s;
    n.addEventListener('click',()=>{
      side.querySelectorAll('.set-nav').forEach(x=>x.classList.remove('active'));
      n.classList.add('active'); show(s);
    });
    side.appendChild(n);
  });
  function show(s){
    if(s==='Персонализация'){
      main.innerHTML = `<h2>Персонализация — Фон</h2>
        <div class="wall-opts">${WALLPAPERS.map((w,i)=>
          `<div class="wall-opt ${i===currentWall?'active':''}" data-i="${i}" style="background-image:url('${w}')"></div>`).join('')}</div>
        <h2 style="margin-top:24px">Цвет акцента</h2>
        <div class="accent-opts">${['#0078d7','#e81123','#00b294','#ff8c00','#8764b8','#498205'].map(c=>
          `<div class="accent-opt" data-c="${c}" style="background:${c}"></div>`).join('')}</div>`;
      main.querySelectorAll('.wall-opt').forEach(o=>o.addEventListener('click',()=>{
        setWallpaper(+o.dataset.i);
        main.querySelectorAll('.wall-opt').forEach(x=>x.classList.remove('active'));
        o.classList.add('active');
      }));
      main.querySelectorAll('.accent-opt').forEach(o=>o.addEventListener('click',()=>{
        document.documentElement.style.setProperty('--accent',o.dataset.c);
        main.querySelectorAll('.accent-opt').forEach(x=>x.classList.remove('active'));
        o.classList.add('active');
      }));
    } else if(s==='Система'){
      main.innerHTML = `<h2>Система — Дисплей</h2>
        <p style="line-height:1.9">Разрешение: ${screen.width} × ${screen.height}<br>
        Масштаб: 100%<br>Ориентация: Альбомная<br>
        Ночной свет: Выкл</p>`;
    } else {
      main.innerHTML = `<h2>Об устройстве</h2>
        <p style="line-height:1.9">
        Имя устройства: WEB-PC<br>
        Издание: Windows 10 Web Simulation<br>
        Версия: 22H2 (сборка ${new Date().getFullYear()})<br>
        Процессор: JavaScript Engine<br>
        ОЗУ: ${navigator.deviceMemory||8} ГБ<br>
        Тип системы: Браузерная ОС</p>`;
    }
  }
  show('Персонализация');
}
